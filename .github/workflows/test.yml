name: Test

on: [push, pull_request, workflow_dispatch]

permissions: {}

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.15"
          - "3.15t"
        os: [ubuntu-latest]
        include:
          - python-version: "3.16"
            os: ubuntu-latest
          - python-version: "3.16t"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: "!startsWith(matrix.python-version, '3.16')"
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Python ${{ matrix.python-version }} (deadsnakes)
        uses: deadsnakes/action@e640ac8743173a67cca4d7d77cd837e514bf98e8 # v3.2.0
        if: startsWith(matrix.python-version, '3.16')
        with:
          python-version: "3.16-dev"
          nogil: ${{ endsWith(matrix.python-version, 't') }}

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python-version, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Diagnose uvx on deadsnakes
        if: startsWith(matrix.python-version, '3.16')
        continue-on-error: true
        run: |
          set -x
          which -a python3.16 python3.16t || true
          python${{ matrix.python-version }} -c "import sys, sysconfig; print(sys.version); print('executable', sys.executable); print('_base_executable', sys._base_executable); print('prefix', sys.prefix); print('scheme', sysconfig.get_default_scheme()); print(sysconfig.get_paths())"
          python${{ matrix.python-version }} -m sysconfig | head -40 || true
          uv venv --python ${{ matrix.python-version }} /tmp/diag-venv
          cat /tmp/diag-venv/pyvenv.cfg
          ls -la /tmp/diag-venv/bin
          /tmp/diag-venv/bin/python -c "import sys, sysconfig; print('venv executable', sys.executable); print('venv scheme', sysconfig.get_default_scheme()); print(sysconfig.get_paths())"
          uv pip install --python /tmp/diag-venv tox
          ls -la /tmp/diag-venv/bin /tmp/diag-venv/local/bin 2>&1 || true
          find /tmp/diag-venv -name tox -o -name 'tox*' | head
          head -1 /tmp/diag-venv/bin/tox || true
          /tmp/diag-venv/bin/tox --version || true
          uvx -v --python ${{ matrix.python-version }} --with tox-uv tox --version 2>&1 | tail -30 || true

      - name: Tox tests
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e py

      - name: Test CLI
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e cli

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }} Python ${{ matrix.python-version }}

  success:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    name: Test successful
    steps:
      - name: Success
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"
