name: Test

on: [push, pull_request, workflow_dispatch]

permissions: {}

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.15"
          - "3.15t"
        os: [ubuntu-latest]
        include:
          - python-version: "3.16"
            os: ubuntu-latest
          - python-version: "3.16t"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: "!startsWith(matrix.python-version, '3.16')"
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Python ${{ matrix.python-version }} (deadsnakes)
        uses: deadsnakes/action@e640ac8743173a67cca4d7d77cd837e514bf98e8 # v3.2.0
        if: startsWith(matrix.python-version, '3.16')
        with:
          python-version: "3.16-dev"
          nogil: ${{ endsWith(matrix.python-version, 't') }}

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python-version, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Diagnose uvx on deadsnakes
        if: startsWith(matrix.python-version, '3.16')
        continue-on-error: true
        shell: bash {0}
        env:
          NO_COLOR: 1
          FORCE_COLOR: 0
        run: |
          set -x
          PY=/usr/bin/python${{ matrix.python-version }}
          ls -la /usr/bin/python3.16* /usr/bin/python3.16t* 2>/dev/null
          sudo apt-get install -y -q strace > /dev/null
          echo "== 1. ephemeral uvx under strace (before anything else touches the tool dir)"
          strace -f -qq -e trace=execve -s 300 -o /tmp/strace.log uvx --python ${{ matrix.python-version }} --with tox-uv tox --version
          grep -nE "tox|ENOENT" /tmp/strace.log | tail -25
          echo "== 2. ephemeral env contents"
          find "$UV_CACHE_DIR/archive-v0" -maxdepth 2 -name pyvenv.cfg | while read -r cfg; do d=$(dirname "$cfg"); echo "--- $d"; cat "$cfg"; ls -la "$d"; ls -la "$d/bin"; ls -la "$d/local/bin" 2>/dev/null; for f in "$d"/bin/tox "$d"/local/bin/tox; do [ -f "$f" ] && { echo "--- $f"; head -5 "$f"; }; done; done
          echo "== 3. uvx verbose, filtered"
          uvx -vv --python ${{ matrix.python-version }} --with tox-uv tox --version 2>&1 | grep -E "Creating|Caching|Running|scripts|bin/|Failed|error|relocat|Using|executable|layout|Layout|entry" | head -60
          echo "== 4. relocatable venv by hand"
          uv venv --relocatable --python $PY /tmp/reloc && uv pip install --python /tmp/reloc tox && ls -la /tmp/reloc/bin && head -5 /tmp/reloc/bin/tox && /tmp/reloc/bin/tox --version
          echo "== 5. non-relocatable venv by hand"
          uv venv --python $PY /tmp/plain && uv pip install --python /tmp/plain tox && ls -la /tmp/plain/bin && head -2 /tmp/plain/bin/tox && /tmp/plain/bin/tox --version
          echo "== 6. uv run instead of uvx"
          uv run --no-project --python ${{ matrix.python-version }} --with tox-uv --with tox tox --version
          echo "== 7. uvx with 3.12 (control)"
          uvx --python 3.12 --with tox-uv tox --version
          true

      - name: Tox tests
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e py

      - name: Test CLI
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e cli

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }} Python ${{ matrix.python-version }}

  success:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    name: Test successful
    steps:
      - name: Success
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"
