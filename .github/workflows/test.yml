name: Test

on: [push, pull_request, workflow_dispatch]

permissions: {}

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.15"
          - "3.15t"
        os: [ubuntu-latest]
        include:
          - python-version: "3.16"
            os: ubuntu-latest
          - python-version: "3.16t"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: "!startsWith(matrix.python-version, '3.16')"
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Python ${{ matrix.python-version }} (deadsnakes)
        uses: deadsnakes/action@e640ac8743173a67cca4d7d77cd837e514bf98e8 # v3.2.0
        if: startsWith(matrix.python-version, '3.16')
        with:
          python-version: "3.16-dev"
          nogil: ${{ endsWith(matrix.python-version, 't') }}

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python-version, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Diagnose uvx on deadsnakes
        if: startsWith(matrix.python-version, '3.16')
        continue-on-error: true
        shell: bash {0}
        run: |
          set -x
          PY=/usr/bin/python${{ matrix.python-version }}
          echo "== base interpreter sysconfig"
          $PY -c "import sys, sysconfig, json; print(sys.version); print('executable', sys.executable, '_base_executable', sys._base_executable); print('prefix', sys.prefix, 'base_prefix', sys.base_prefix, 'exec_prefix', sys.exec_prefix); print('default scheme', sysconfig.get_default_scheme()); print('preferred venv scheme', sysconfig.get_preferred_scheme('prefix')); print('schemes', sysconfig.get_scheme_names()); [print(scheme, json.dumps(sysconfig.get_paths(scheme))) for scheme in sysconfig.get_scheme_names() if scheme.startswith(('posix', 'venv', 'deb'))]"
          echo "== uv tool install (persistent env we can inspect)"
          uv tool install --python ${{ matrix.python-version }} tox --with tox-uv
          T=$(uv tool dir)/tox
          cat "$T/pyvenv.cfg"
          ls -la "$T/bin" "$T/local/bin" "$T"
          find "$T" -maxdepth 3 -name 'tox' -o -maxdepth 3 -name 'tox-*' -o -maxdepth 3 -name 'virtualenv'
          [ -f "$T/bin/tox" ] && head -1 "$T/bin/tox" && "$T/bin/tox" --version
          uv tool run tox --version
          tox --version
          echo "== ephemeral env from uvx"
          uvx --python ${{ matrix.python-version }} --with tox-uv tox --version
          find "$UV_CACHE_DIR/archive-v0" -maxdepth 2 -name pyvenv.cfg | while read -r cfg; do d=$(dirname "$cfg"); echo "--- $d"; cat "$cfg"; ls -la "$d/bin"; ls -la "$d/local/bin" 2>/dev/null; [ -f "$d/bin/tox" ] && head -1 "$d/bin/tox"; done
          echo "== uvx with explicit /usr/bin interpreter"
          uvx --python $PY --with tox-uv tox --version
          echo "== uvx with explicit deadsnakes venv interpreter"
          uvx --python "$HOME/venv-${{ matrix.python-version }}/bin/python${{ matrix.python-version }}" --with tox-uv tox --version
          echo "== uvx with a uv-created venv as the interpreter"
          uv venv --python $PY /tmp/diag-venv && uvx --python /tmp/diag-venv/bin/python --with tox-uv tox --version
          echo "== plain python -m venv + pip"
          $PY -m venv /tmp/pyvenv && /tmp/pyvenv/bin/pip install -q tox && ls -la /tmp/pyvenv/bin && /tmp/pyvenv/bin/tox --version
          true

      - name: Tox tests
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e py

      - name: Test CLI
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e cli

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }} Python ${{ matrix.python-version }}

  success:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    name: Test successful
    steps:
      - name: Success
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"
